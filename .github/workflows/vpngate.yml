name: VPN Gate OpenVPN Optimizer
on:
  workflow_dispatch:
    inputs:
      parse_only:
        description: 只解析，不连接和发布
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: vpngate-openvpn-optimizer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-subscription.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Go for WARP probe
        if: ${{ !inputs.parse_only }}
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/warp-probe/go.mod
          cache: false
      - name: Resolve WARP probe dependencies
        if: ${{ !inputs.parse_only }}
        working-directory: tools/warp-probe
        run: go mod tidy
      - name: Test WARP handshake probe
        if: ${{ !inputs.parse_only }}
        working-directory: tools/warp-probe
        run: go test -v ./...
      - name: Confirm real WARP handshake and HTTPS
        if: ${{ !inputs.parse_only }}
        id: warp_probe
        working-directory: tools/warp-probe
        env:
          VPNGATE_WARP_CONFIG: ${{ secrets.VPNGATE_WARP_CONFIG }}
        run: go run ./cmd/warp-probe
      - name: Install Mihomo v1.19.33 and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          V="v1.19.33"
          A="$RUNNER_TEMP/mihomo.gz"
          U="https://github.com/MetaCubeX/mihomo/releases/download/$V/mihomo-linux-amd64-compatible-$V.gz"
          S="386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$U" --output "$A"
          echo "$S  $A" | sha256sum --check --status
          gunzip -c "$A" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
          echo "MIHOMO_PATH=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Fetch all latest VPN Gate nodes and check connectivity
        env:
          MIHOMO_PATH: ${{ runner.temp }}/mihomo
          VPNGATE_PROBE_WORKERS: "3"
          VPNGATE_DIAGNOSTICS_DIR: ${{ runner.temp }}/vpngate-diagnostics
          VPNGATE_WARP_CONFIG: ${{ secrets.VPNGATE_WARP_CONFIG }}
          VPNGATE_WARP_VERIFIED_PORTS: ${{ steps.warp_probe.outputs.verified_ports }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.parse_only }}" == "true" ]]; then
            python scripts/vpngate_optimizer.py --parse-only
            exit 0
          fi
          python scripts/vpngate_optimizer.py --output "$RUNNER_TEMP/vpngate-clash-mi.yaml"
          "$MIHOMO_PATH" -t -f "$RUNNER_TEMP/vpngate-clash-mi.yaml"
          python - "$RUNNER_TEMP/vpngate-clash-mi.yaml" <<'PY'
          import sys, yaml
          data = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          proxies = data.get("proxies", [])
          assert proxies and proxies[0].get("name") == "WARP" and proxies[0].get("type") == "wireguard"
          openvpn = proxies[1:]
          assert openvpn and all(p.get("type") == "openvpn" and p.get("dialer-proxy") == "WARP" for p in openvpn)
          names = {p["name"] for p in proxies}
          groups = {g["name"]: g for g in data.get("proxy-groups", [])}
          valid_names = names | set(groups)
          assert all(n in valid_names for group in groups.values() for n in group.get("proxies", []))
          assert list(groups) == ["出站节点"]
          assert groups["出站节点"]["proxies"] == ["WARP"] + [p["name"] for p in openvpn]
          assert data.get("rules", [None])[0] == "MATCH,出站节点"
          print("Validated WARP + OpenVPN nodes:", len(openvpn))
          PY
      - name: Publish to Cloudflare KV
        if: ${{ success() && !inputs.parse_only }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_NAMESPACE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          test -n "$CF_NAMESPACE" || { echo "::error::Missing CLOUDFLARE_KV_NAMESPACE_ID"; exit 2; }
          OUT="$RUNNER_TEMP/cf-kv.json"
          curl --fail --silent --show-error --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$CF_NAMESPACE/values/vpngate-clash-mi.yaml" \
            --header "Authorization: Bearer $CF_TOKEN" \
            --header "Content-Type: application/yaml" \
            --data-binary "@$RUNNER_TEMP/vpngate-clash-mi.yaml" --output "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not data.get("success"):
              print("Cloudflare KV error:", json.dumps(data.get("errors", [])))
              raise SystemExit(1)
          print("Published VPN Gate subscription to KV.")
          PY
      - name: Upload failed-node diagnostics
        if: ${{ always() && !inputs.parse_only }}
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-mihomo-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vpngate-diagnostics/**/*.log
            ${{ runner.temp }}/vpngate-diagnostics/**/failure.txt
          if-no-files-found: ignore
          retention-days: 7
