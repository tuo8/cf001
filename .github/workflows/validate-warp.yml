name: Validate WARP Secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-warp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-subscription.txt
      - name: Install Mihomo v1.19.33 and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          V="v1.19.33"
          A="$RUNNER_TEMP/mihomo.gz"
          U="https://github.com/MetaCubeX/mihomo/releases/download/$V/mihomo-linux-amd64-compatible-$V.gz"
          S="386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$U" --output "$A"
          echo "$S  $A" | sha256sum --check --status
          gunzip -c "$A" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "MIHOMO_PATH=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Validate WARP secret and Mihomo schema only
        env:
          VPNGATE_WARP_CONFIG: ${{ secrets.VPNGATE_WARP_CONFIG }}
          MIHOMO_PATH: ${{ runner.temp }}/mihomo
        run: |
          python - <<'PY'
          import os, sys, tempfile, subprocess
          from pathlib import Path
          import yaml
          sys.path.insert(0, "scripts")
          from vpngate_optimizer import load_warp_config, build_warp_proxy
          proxy = build_warp_proxy(load_warp_config())
          document = {"proxies": [proxy], "proxy-groups": [{"name": "WARP-VALIDATION", "type": "select", "proxies": ["WARP"]}], "rules": ["MATCH,WARP-VALIDATION"]}
          with tempfile.TemporaryDirectory(prefix="warp-validation-") as directory:
              path = Path(directory) / "warp-only.yaml"
              path.write_text(yaml.safe_dump(document, allow_unicode=True, sort_keys=False), encoding="utf-8")
              result = subprocess.run([os.environ["MIHOMO_PATH"], "-t", "-f", str(path)], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit("Mihomo rejected the WARP-only config; output withheld to protect secret material")
          print("PASS: WARP secret format and Mihomo configuration validated.")
          print("No VPN Gate fetch, connectivity probe, or Cloudflare KV publication performed.")
          PY