name: WARP handshake probe

on:
  push:
    branches: [main]
    paths:
      - "tools/warp-probe/**"
      - ".github/workflows/warp-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/warp-probe/go.mod
          cache: false

      - name: Resolve Go dependencies
        working-directory: tools/warp-probe
        run: go mod tidy

      - name: Run unit tests
        working-directory: tools/warp-probe
        run: go test -v ./...

      - name: Verify real WARP handshake and HTTPS
        working-directory: tools/warp-probe
        env:
          VPNGATE_WARP_CONFIG: \${{ secrets.VPNGATE_WARP_CONFIG }}
        run: go run ./cmd/warp-probe
