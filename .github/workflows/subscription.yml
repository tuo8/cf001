name: Subscription Optimizer
on:
  workflow_dispatch:
    inputs:
      region:
        description: 区域代码，例如 SIN,NRT；留空为全部
        required: false
        default: ''
      sort:
        description: 排名方式
        type: choice
        options: [speed]
        default: speed
      subscription_source:
        description: 正式订阅源（读取仓库 Secret TEST_SUBSCRIPTION_URL）
        type: choice
        options: [formal]
        default: formal
      node_filter:
        description: 可选，按节点名称包含关键词筛选，例如 US9
        required: false
        default: ''
      server_filter:
        description: 可选，按服务器 IP/域名精确筛选，例如 5.161.19.165
        required: false
        default: ''
      inventory_only:
        description: 仅输出节点名称、服务器地址和端口，不测速、不生成配置
        type: boolean
        required: false
        default: false
      endpoint_check_only:
        description: 对当前订阅中的服务器地址做 TCP 连通性诊断，不生成代理配置
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: subscription-optimizer
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-subscription.txt
      - name: Run parser unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          # Pin a verified release so installation does not depend on unauthenticated GitHub API rate limits.
          V="v1.19.31"
          U="https://github.com/MetaCubeX/mihomo/releases/download/${V}/mihomo-linux-amd64-compatible-${V}.gz"
          SHA256="04cf9f09671704f839ddbee2e93069dc831a4123a75281e725d1d96ab9ac1afc"
          ARCHIVE="$RUNNER_TEMP/mihomo.gz"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$U" --output "$ARCHIVE"
          echo "${SHA256}  ${ARCHIVE}" | sha256sum --check --status || { echo "::error::Mihomo archive SHA-256 mismatch"; exit 1; }
          gunzip -c "$ARCHIVE" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
          echo "MIHOMO_PATH=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Optimize and validate
        env:
          SUBSCRIPTION_URL: ${{ secrets.TEST_SUBSCRIPTION_URL }}
          CLASH_PROXY_TEMPLATE: ${{ secrets.CLASH_PROXY_TEMPLATE }}
          ENDPOINT_MAX_CANDIDATES: ${{ vars.ENDPOINT_MAX_CANDIDATES || '60' }}
          REGION_FILTER: ${{ github.event.inputs.region }}
          NODE_NAME_FILTER: ${{ github.event.inputs.node_filter }}
          NODE_SERVER_FILTER: ${{ github.event.inputs.server_filter }}
          NODE_INVENTORY_ONLY: ${{ github.event.inputs.inventory_only }}
          NODE_ENDPOINT_CHECK_ONLY: ${{ github.event.inputs.endpoint_check_only }}
          SORT_BY: speed
          TOP_N: '100'
          PROBE_WORKERS: ${{ vars.PROBE_WORKERS || '8' }}
          DOWNLOAD_TEST_URL: ${{ vars.DOWNLOAD_TEST_URL || 'https://speed.cloudflare.com/__down?bytes=5242880' }}
          LATENCY_TEST_URLS: ${{ vars.LATENCY_TEST_URLS || '' }}
          DOWNLOAD_TEST_URLS: ${{ vars.DOWNLOAD_TEST_URLS || '' }}
        run: |
          set -euo pipefail
          test -n "$SUBSCRIPTION_URL" || { echo "::error::请在仓库 Secrets 中设置正式订阅 Secret：TEST_SUBSCRIPTION_URL"; exit 2; }
          if [[ "${NODE_ENDPOINT_CHECK_ONLY:-false}" == "true" ]]; then
            python scripts/subscription_optimizer.py --endpoint-check-only --output "$RUNNER_TEMP/clash-mi.yaml"
            exit 0
          fi
          if [[ "${NODE_INVENTORY_ONLY:-false}" == "true" ]]; then
            python scripts/subscription_optimizer.py --inventory-only --output "$RUNNER_TEMP/clash-mi.yaml"
            exit 0
          fi
          python scripts/subscription_optimizer.py --output "$RUNNER_TEMP/clash-mi.yaml" --v2rayn-output "$RUNNER_TEMP/v2rayn.txt"
          python - "$RUNNER_TEMP/clash-mi.yaml" <<'PY'
          import sys,yaml
          d=yaml.safe_load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('proxies') and d.get('proxy-groups') and d.get('rules')
          names={p['name'] for p in d['proxies']}
          assert all(n in names for g in d['proxy-groups'] for n in g.get('proxies',[]))
          print('Clash YAML structure valid:',len(names),'proxies')
          PY
      - name: Validate v2rayN subscription output
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || (!inputs.inventory_only && !inputs.endpoint_check_only)) }}
        run: test -s "$RUNNER_TEMP/v2rayn.txt"
      - name: Publish validated subscription to Cloudflare KV
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || (!inputs.inventory_only && !inputs.endpoint_check_only)) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 2; }
          test -n "${CLOUDFLARE_KV_NAMESPACE_ID}" || { echo "::error::Missing CLOUDFLARE_KV_NAMESPACE_ID repository variable"; exit 2; }
          response="$RUNNER_TEMP/cloudflare-kv-response.json"
          curl --fail --silent --show-error \
            --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${CLOUDFLARE_KV_NAMESPACE_ID}/values/clash-mi.yaml" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/yaml" \
            --data-binary "@$RUNNER_TEMP/clash-mi.yaml" \
            --output "$response"
          python - "$response" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              result=json.load(f)
          if not result.get("success"):
              errors=result.get("errors") or []
              print("Cloudflare KV publish failed:", json.dumps(errors, ensure_ascii=False))
              raise SystemExit(1)
          print("Cloudflare KV publish succeeded.")
          PY
          v2response="$RUNNER_TEMP/cloudflare-kv-v2rayn-response.json"
          curl --fail --silent --show-error \
            --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${CLOUDFLARE_KV_NAMESPACE_ID}/values/v2rayn.txt" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: text/plain" \
            --data-binary "@$RUNNER_TEMP/v2rayn.txt" \
            --output "$v2response"
          python - "$v2response" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              result=json.load(f)
          if not result.get("success"):
              errors=result.get("errors") or []
              print("Cloudflare KV v2rayN publish failed:", json.dumps(errors, ensure_ascii=False))
              raise SystemExit(1)
          print("Cloudflare KV v2rayN publish succeeded.")
          PY
      - name: Upload artifact only for private repositories
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: clash-mi-subscription-${{ github.run_number }}
          path: ${{ runner.temp }}/clash-mi.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Warn for public repository
        if: ${{ github.event.repository.private != true }}
        run: echo "::warning::仓库是公开的，为避免泄露代理凭据，已跳过上传配置 artifact。请将仓库设为 Private 后重新运行。"
